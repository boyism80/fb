# Multi-runner: cache in registry (ghcr.io) so all runners share it. Single platform (amd64).
name: build fb - Linux

on:
  push:
    branches:
      - release/**
    paths-ignore:
      - '**.md'
      - 'wiki/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-linux:
    runs-on: [self-hosted, linux, build, epyc]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
         version: latest

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for data
        id: meta-data
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/data
          flavor: |
            latest=true

      - name: Build data image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-data.outputs.tags }}
          labels: ${{ steps.meta-data.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/data:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/data:buildcache,mode=max
          file: server/fb/data/Dockerfile

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/build
          flavor: |
            latest=true

      - name: Build based builder image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/build:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/build:buildcache,mode=max
          file: server/fb/Dockerfile

  internal:
    runs-on: [self-hosted, linux, build]
    permissions:
      contents: read
      packages: write
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
