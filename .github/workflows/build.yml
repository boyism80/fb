          file: server/http/Dockerfile
          build-args: |
            SERVICE=marketplace

  cleanup-cache:
    runs-on: [self-hosted, linux, build]
    permissions:
      contents: read
      packages: write
    needs: [build-linux, internal, write-back, gateway, login, game, bot, admin-tool, log, marketplace]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prune stale GHCR cache
        run: bash tools/prune-ghcr-cache.sh

  deploy:
    runs-on: [self-hosted, linux, master]
    permissions:
      contents: read
      packages: write
    needs: [internal, write-back, bot, gateway, login, game, admin-tool, log, marketplace]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: infra/pulumi

      - name: Installing dependencies
        run: npm install
        working-directory: infra/pulumi

      - name: Shutdown server
        uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        with:
          work-dir: infra/pulumi
          command: destroy
          stack-name: dev

      - name: Deploy server
        uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        with:
          work-dir: infra/pulumi
          command: up
          stack-name: dev
          refresh: true
          config-map: "{host: {value: '${{ secrets.REMOTE_IP }}', secret: true}}"

  build-windows:
    runs-on: [self-hosted, windows, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          clean: false

      - name: Update modules
        run: .\update-modules.bat
        working-directory: tools

      - name: Generate json from tables
        run: .\update-data.bat true
        working-directory: tools

      - name: Create build directory
        run: if (-Not (Test-Path build)) { mkdir build }

      - name: Configure CMake
        run: cmake ..
        working-directory: build

      - name: Build c++
        run: |
          cmake --build . --config Debug
          mv -Force server\gateway\Debug\gateway.exe gateway.exe
          mv -Force server\login\Debug\login.exe login.exe
          mv -Force server\game\Debug\game.exe game.exe
        working-directory: build

      - name: Build internal
        run: dotnet publish server/internal/internal.csproj -c Release -o build/internal

      - name: Build write-back
        run: dotnet publish server/write-back/write-back.csproj -c Release -o build/write-back

      - name: Build admin-tool
        run: dotnet publish server/admin-tool/admin-tool.csproj -c Release -o build/admin-tool

      - name: Build log
        run: dotnet publish server/log/log.csproj -c Release -o build/log

      - name: Build marketplace
        run: dotnet publish server/marketplace/marketplace.csproj -c Release -o build/marketplace

      - name: Extract maps
        shell: powershell
        run: |
          if (Test-Path "resources\maps\maps.zip") {
            if (Test-Path "build\maps") { Remove-Item "build\maps" -Recurse -Force }
            New-Item -ItemType Directory -Force -Path "build\maps" | Out-Null
            Expand-Archive -Path "resources\maps\maps.zip" -DestinationPath "build\maps" -Force
          } else {
            Write-Host "Warning: resources\maps\maps.zip not found"
          }

      - name: Copy scripts
        shell: powershell
        run: |
          if (Test-Path "server\game\scripts") {
            if (Test-Path "build\scripts") { Remove-Item "build\scripts" -Recurse -Force }
            New-Item -ItemType Directory -Force -Path "build\scripts" | Out-Null
            Copy-Item -Path "server\game\scripts\*" -Destination "build\scripts" -Recurse -Force
          } else {
            Write-Host "Warning: server\game\scripts not found"
          }

      - name: Copy json
        shell: powershell
        run: |
          if (Test-Path "server\game\json") {
            if (Test-Path "build\json") { Remove-Item "build\json" -Recurse -Force }
            New-Item -ItemType Directory -Force -Path "build\json" | Out-Null
            Copy-Item -Path "server\game\json\*" -Destination "build\json" -Recurse -Force

            # .NET services load tables from json/ under their publish output (see DataTableLoader)
            $jsonConsumers = @("internal", "admin-tool", "marketplace")
            foreach ($svc in $jsonConsumers) {
              $dest = Join-Path (Join-Path "build" $svc) "json"
              if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $dest | Out-Null
              Copy-Item -Path "build\json\*" -Destination $dest -Recurse -Force
              Write-Host "Synced build\json to build\$svc\json"
            }
          } else {
            Write-Host "Warning: server\game\json not found"
          }

      - name: Copy config files
        shell: powershell
        run: |
          $configs = @(
            @{source="server\gateway\config\config.dev.json"; dest="build\config.gateway.json"},
            @{source="server\login\config\config.dev.json"; dest="build\config.login.json"},
            @{source="server\game\config\config.dev.json"; dest="build\config.game.json"}
          )
          
          foreach ($config in $configs) {
            if (Test-Path $config.source) {
              Copy-Item -Path $config.source -Destination $config.dest -Force
              Write-Host "Copied $($config.source) to $($config.dest)"
            } else {
              Write-Host "Warning: $($config.source) not found"
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            build/gateway.exe
            build/login.exe
            build/game.exe
            build/internal
            build/write-back
            build/admin-tool
            build/log
            build/marketplace
            build/maps
            build/scripts
            build/json
            build/config.gateway.json
            build/config.login.json
            build/config.game.json
          retention-days: 7

      - name: Prepare dist package
        shell: powershell
        run: |
          $distZip = "dist_zip"
          if (Test-Path $distZip) { Remove-Item $distZip -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $distZip | Out-Null

          Copy-Item build\gateway.exe, build\login.exe, build\game.exe -Destination $distZip
          Copy-Item build\internal -Destination (Join-Path $distZip "internal") -Recurse
          Copy-Item build\write-back -Destination (Join-Path $distZip "write-back") -Recurse
          Copy-Item build\log -Destination (Join-Path $distZip "log") -Recurse
          Copy-Item build\marketplace -Destination (Join-Path $distZip "marketplace") -Recurse
          Copy-Item build\admin-tool -Destination (Join-Path $distZip "admin-tool") -Recurse
          if (Test-Path build\maps) { Copy-Item build\maps -Destination (Join-Path $distZip "maps") -Recurse }
          if (Test-Path build\scripts) { Copy-Item build\scripts -Destination (Join-Path $distZip "scripts") -Recurse }
          if (Test-Path build\json) { Copy-Item build\json -Destination (Join-Path $distZip "json") -Recurse }

      - name: Zip dist package
        shell: powershell
        run: |
          Compress-Archive -Path dist_zip\* -DestinationPath dist.zip -Force

      - name: Upload zip to NAS
        shell: powershell
        run: |
          curl.exe -T dist.zip -u "$env:NAS_ID`:$env:NAS_PW" http://cshyeon.com:8080/upload/fb/dist.zip
        env:
          NAS_ID: ${{ secrets.NAS_ID }}
          NAS_PW: ${{ secrets.NAS_PW }}