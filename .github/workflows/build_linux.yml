name: build fb

on:
  - push

jobs:
  base:
    runs-on: [self-hosted, linux, x64, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build based builder image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: cshyeon/fb:build
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max
          file: Dockerfile

  internal:
    runs-on: [self-hosted, linux, x64, build]
    needs: base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build internal server
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: cshyeon/fb:internal
          cache-from: type=gha,scope=internal
          cache-to: type=gha,scope=internal,mode=max
          file: http/Dockerfile
          build-args: |
            SERVICE=internal

  gateway:
    runs-on: [self-hosted, linux, x64, build]
    needs: base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build gateway server
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: cshyeon/fb:gateway
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
          file: gateway/Dockerfile

  login:
    runs-on: [self-hosted, linux, x64, build]
    needs: base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build login server
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: cshyeon/fb:login
          cache-from: type=gha,scope=login
          cache-to: type=gha,scope=login,mode=max
          file: login/Dockerfile

  game:
    runs-on: [self-hosted, linux, x64, build]
    needs: base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build game server
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: cshyeon/fb:game
          cache-from: type=gha,scope=game
          cache-to: type=gha,scope=game,mode=max
          file: game/Dockerfile

  deploy:
    runs-on: [self-hosted, linux, x64, build]
    needs: [internal, gateway, login, game]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node LTS
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: npm

      - name: Installing dependencies
        run: npm install
        working-directory: infra/pulumi

      - name: Deploy server
        uses: pulumi/actions@v6
        id: pulumi
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        with:
          work-dir: infra/pulumi
          command: up
          stack-name: dev