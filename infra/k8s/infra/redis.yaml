---
apiVersion: v1
kind: Service
metadata:
  name: redis-dev
  namespace: fb
spec:
  type: ClusterIP
  selector:
    app: redis
    section: dev
  ports:
    - name: redis-dev-global
      port: 6379
      targetPort: r0
    - name: redis-dev-0
      port: 6380
      targetPort: r1
---
apiVersion: v1
kind: Service
metadata:
  name: redis-dev-nodeport
  namespace: fb
spec:
  type: NodePort
  selector:
    app: redis
    section: dev
  ports:
    - name: redis-dev-global
      port: 6379
      targetPort: r0
      nodePort: 30110
    - name: redis-dev-0
      port: 6380
      targetPort: r1
      nodePort: 30111
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-dev-global
  namespace: fb
spec:
  serviceName: redis-dev
  replicas: 1
  selector:
    matchLabels:
      app: redis
      section: dev
  template:
    metadata:
      labels:
        app: redis
        section: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: infra
                    operator: In
                    values: ["true"]
      containers:
        - name: redis
          image: redis:6.2.4
          ports:
            - containerPort: 6379
              name: r0
          volumeMounts:
            - name: data-volume-dev-global
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
      volumes:
        - name: data-volume-dev-global
          hostPath:
            path: /mnt/fb/redis/dev/global
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-dev-0
  namespace: fb
spec:
  serviceName: redis-dev
  replicas: 1
  selector:
    matchLabels:
      app: redis
      section: dev
  template:
    metadata:
      labels:
        app: redis
        section: dev
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: infra
                    operator: In
                    values: ["true"]
      containers:
        - name: redis
          image: redis:6.2.4
          ports:
            - containerPort: 6379
              name: r1
          volumeMounts:
            - name: data-volume-dev-0
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
      volumes:
        - name: data-volume-dev-0
          hostPath:
            path: /mnt/fb/redis/dev/0
            type: DirectoryOrCreate
---
