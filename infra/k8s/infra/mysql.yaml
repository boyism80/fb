# Per-world global MySQL (dev world, minimal: 1 global + 1 data + 1 log + unified)
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-dev-global
  namespace: fb
spec:
  type: ClusterIP
  selector:
    app: mysql
    section: dev
    type: global
  ports:
    - name: mysql-dev-global
      port: 3306
      targetPort: m0
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-dev-global-nodeport
  namespace: fb
spec:
  type: NodePort
  selector:
    app: mysql
    section: dev
    type: global
  ports:
    - name: mysql-dev-global
      port: 3306
      targetPort: m0
      nodePort: 30100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-dev-global
  namespace: fb
spec:
  serviceName: mysql-dev-global
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      section: dev
      type: global
  template:
    metadata:
      labels:
        app: mysql
        section: dev
        type: global
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: infra
                    operator: In
                    values: ["true"]
      containers:
        - name: mysql
          image: mysql:8.4.3
          args: ["--mysql-native-password=ON"]
          ports:
            - containerPort: 3306
              name: m0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: data-volume-dev-global
              mountPath: /var/lib/mysql
            - name: init-sql-volume
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-ufb", "-padmin"]
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-ufb", "-padmin"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data-volume-dev-global
          hostPath:
            path: /mnt/fb/mysql/dev/global
            type: DirectoryOrCreate
        - name: init-sql-volume
          configMap:
            name: init-sql
---
