apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal
  namespace: fb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: internal
  template:
    metadata:
      labels:
        app: internal
    spec:
      containers:
        - name: internal
          image: fb/internal:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: internal
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: k8s
            - name: ASPNETCORE_HTTP_PORTS
              value: "80"
          volumeMounts:
            - name: config-volume
              mountPath: /app/appsettings.k8s.json
              subPath: appsettings.k8s.json
          startupProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: internal
---
apiVersion: v1
kind: Service
metadata:
  name: internal
  namespace: fb
spec:
  type: NodePort
  selector:
    app: internal
  ports:
    - name: internal
      port: 80
      targetPort: internal
      nodePort: 30200
