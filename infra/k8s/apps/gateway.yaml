apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  namespace: fb
spec:
  serviceName: gateway
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: fb/gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 30000
              name: gateway
          command: ["./gateway"]
          args: ["-c", "config.json"]
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.json
              subPath: config.json
          readinessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: gateway
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fb
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 30000
      targetPort: gateway
      nodePort: 30000
